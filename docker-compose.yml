# ShopSage Micro Platform - local development stack (Compose Spec: no top-level `version:`).
#
#   default profile   postgres, redis, kafka (+ one-shot kafka-init), prometheus, grafana, jaeger
#   --profile tools   kafka-ui                         http://localhost:8089
#   --profile app     the four Spring Boot services, built from the root Dockerfile
#
# Use ./scripts/dev-up.sh rather than a bare `docker compose up`: it waits for health, runs
# kafka-init, verifies all 20 topics and prints URLs/credentials.
#
# Dev-only posture: default credentials, Kafka PLAINTEXT, Grafana anonymous Viewer, unauthenticated
# Prometheus lifecycle API. Every published port binds to ${BIND_HOST:-127.0.0.1} because
# Docker-published ports bypass host firewalls. The Day 10 Helm values turn all of this off.
#
# Reserved for Day 7 (not defined yet): Toxiproxy `chaos` profile - API 8474, proxies
# 15432 -> postgres, 16379 -> redis, 39092 -> a dedicated Kafka CHAOS listener.
name: shopsage

# Bounded json-file logs so a long load test cannot fill the Docker VM disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Shared by the four app services. Merge keys keep each service block down to what differs.
x-app-defaults: &app-defaults
  profiles: [app]
  restart: unless-stopped
  logging: *default-logging
  mem_limit: ${APP_MEM_LIMIT:-1g}
  # shopsage/*:local images are built locally (`build:` below) and must never be pulled: anyone can
  # publish a shopsage/* repository on Docker Hub (name squatting).
  pull_policy: never
  # Longer than Spring's 20s graceful-shutdown phase, so in-flight requests and Kafka
  # offsets are committed before Docker sends SIGKILL.
  stop_grace_period: 30s

x-app-env: &app-env
  OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# inventory, order and payment only: user-service is HTTP-only and has no Kafka client.
x-kafka-app-env: &kafka-app-env
  <<: *app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_OBSERVATION_ENABLED: ${KAFKA_OBSERVATION_ENABLED:-true}

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

# Start order only. An app's healthcheck probes /actuator/health/readiness, which is UP once the
# Spring context has finished starting (Flyway already migrated its database during boot); the
# readiness group does not include the db/redis/kafka indicators, so it does not track them later.
x-app-depends-on: &app-depends-on
  postgres:
    condition: service_healthy
  jaeger:
    condition: service_healthy

# The Kafka-using services also wait for the broker and for all 20 topics (auto-create is off).
x-kafka-app-depends-on: &kafka-app-depends-on
  <<: *app-depends-on
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

services:
  # ---------------------------------------------------------------------------------------------
  # Infrastructure (default profile)
  # ---------------------------------------------------------------------------------------------
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    logging: *default-logging
    # One instance, four logical databases (database-per-service, ADR-0001). The init script
    # creates a role + database per service and revokes CONNECT from PUBLIC.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopsage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopsage}
      POSTGRES_DB: shopsage
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-shopsage_user}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-shopsage_inventory}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-shopsage_order}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-shopsage_payment}
    # 4 services x Hikari pool 20 = 80, plus headroom for psql, Flyway and load-test bursts.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init:/docker-entrypoint-initdb.d:ro
    # Docker's 64 MB default /dev/shm is too small for parallel query workers.
    shm_size: 256mb
    mem_limit: 768m
    healthcheck:
      # TCP, not the Unix socket: during first boot the entrypoint runs init scripts against a
      # socket-only temporary server, so a socket probe would report healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    logging: *default-logging
    # Pure cache (inventory write-through, Day 3): no RDB/AOF, LRU eviction at 256 MB.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:6379:6379"
    # The image declares VOLUME /data; tmpfs avoids leaking an anonymous volume per start.
    tmpfs: [/data]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BIND_HOST:-127.0.0.1}:9092:9092"
    # Single-node KRaft (combined broker + controller, no ZooKeeper). Two client listeners:
    # containers use kafka:29092, host processes (./mvnw spring-boot:run) use localhost:9092.
    # Clients reconnect to the *advertised* address, so with BIND_HOST=0.0.0.0 set
    # KAFKA_ADVERTISED_HOST to the VM's IP or DNS name for clients on other machines.
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      # Topics are created explicitly by kafka-init; a typo'd topic name must fail loudly
      # instead of silently creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      # Persist the log so Saga history survives restarts, consistent with Postgres. The image
      # ships /var/lib/kafka/data owned by appuser (uid 1000); a fresh named volume inherits that.
      - kafka_data:/var/lib/kafka/data
    # The image declares these as VOLUMEs; tmpfs stops each start leaking anonymous volumes.
    tmpfs: [/etc/kafka/secrets, /mnt/shared/config]
    mem_limit: 1g
    healthcheck:
      # /opt/kafka/bin is not on PATH in the official image. The CLI JVM would otherwise inherit the
      # broker's KAFKA_HEAP_OPTS (512m) inside the 1 GiB limit, hence -Xmx64m. Probes the container
      # listener (kafka:29092), which is what the apps and kafka-init actually use.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # One-shot: creates the ten Saga topics plus a .DLT twin each (20 total), then exits 0.
  kafka-init:
    image: apache/kafka:3.9.2
    restart: "no"
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      # Must match com.shopsage.common.event.Topics.all().
      TOPICS: >-
        order.created order.cancelled
        inventory.reserved inventory.rejected inventory.released
        payment.captured payment.failed payment.refunded
        shipping.dispatched shipping.failed
      PARTITIONS: "3"
    volumes:
      - ./configs/kafka/create-topics.sh:/create-topics.sh:ro
    tmpfs: [/etc/kafka/secrets, /mnt/shared/config, /var/lib/kafka/data]
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Dev-only: exposes unauthenticated POST /-/reload and /-/quit (reload is handy after editing
      # prometheus.yml; quit stops Prometheus).
      - --web.enable-lifecycle
    ports:
      - "${BIND_HOST:-127.0.0.1}:9090:9090"
    # Lets Prometheus scrape services started on the host; host-gateway makes the name
    # resolve on Linux too (Docker Desktop/colima provide it natively).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # PROMETHEUS_TARGETS=host (apps via ./mvnw spring-boot:run) or docker (--profile app);
      # dev-up.sh picks docker for --with-apps. See configs/prometheus/prometheus.yml.
      - ./configs/prometheus/targets/${PROMETHEUS_TARGETS:-host}.json:/etc/prometheus/targets/active.json:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    healthcheck:
      # The image is busybox-based: wget exists, curl does not.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Skips downloading Grafana's preinstalled app plugins on first boot; nothing here needs them.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  jaeger:
    # Pinned to 2.20.0: 2.21+ removed the v1 HTTP query API (/api/services, /api/traces) that
    # Grafana 13.2's bundled Jaeger datasource still calls. Revisit when it speaks /api/v3.
    image: jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BIND_HOST:-127.0.0.1}:16686:16686" # UI + query API
      - "${BIND_HOST:-127.0.0.1}:4317:4317"   # OTLP gRPC
      - "${BIND_HOST:-127.0.0.1}:4318:4318"   # OTLP HTTP (what the services use)
    # Default in-memory storage. TODO(Day 8): tune max_traces and a sampling preset for load runs.
    # The image declares VOLUME /tmp; tmpfs avoids leaking an anonymous volume per start.
    tmpfs: [/tmp]
    mem_limit: 1g
    healthcheck:
      # healthcheckv2 extension on :13133 (internal only, deliberately not published).
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------------------------
  # Tools (--profile tools)
  # ---------------------------------------------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: shopsage-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${BIND_HOST:-127.0.0.1}:8089:8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------------------------------------
  # Applications (--profile app). One root Dockerfile, selected by the SERVICE build arg.
  # ---------------------------------------------------------------------------------------------
  user-service:
    <<: *app-defaults
    image: shopsage/user-service:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    # HTTP-only: no Kafka client, so it does not wait for kafka/kafka-init.
    depends_on: *app-depends-on
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/shopsage_user
      DB_USERNAME: shopsage_user
      DB_PASSWORD: ${USER_DB_PASSWORD:-shopsage_user}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8081:8081"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]

  inventory-service:
    <<: *app-defaults
    image: shopsage/inventory-service:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    depends_on:
      <<: *kafka-app-depends-on
      redis:
        condition: service_healthy
    environment:
      <<: *kafka-app-env
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/shopsage_inventory
      DB_USERNAME: shopsage_inventory
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-shopsage_inventory}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${BIND_HOST:-127.0.0.1}:8082:8082"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]

  order-service:
    <<: *app-defaults
    image: shopsage/order-service:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    depends_on: *kafka-app-depends-on
    environment:
      <<: *kafka-app-env
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/shopsage_order
      DB_USERNAME: shopsage_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-shopsage_order}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8083:8083"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]

  payment-service:
    <<: *app-defaults
    image: shopsage/payment-service:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    depends_on: *kafka-app-depends-on
    environment:
      <<: *kafka-app-env
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/shopsage_payment
      DB_USERNAME: shopsage_payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-shopsage_payment}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8084:8084"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health/readiness"]

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
