# Every value that differs between laptop, compose and k8s is an env var with a laptop-friendly default
# (`./mvnw -pl services/user-service spring-boot:run` against ./scripts/dev-up.sh works with no extra setup).
spring:
  application:
    name: user-service
  lifecycle:
    # Must stay below compose stop_grace_period (30s) and the k8s terminationGracePeriodSeconds.
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopsage_user}
    username: ${DB_USERNAME:shopsage_user}
    password: ${DB_PASSWORD:shopsage_user}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    mbeanregistry:
      # exports tomcat_threads_*/tomcat_connections_* for the load-test dashboards (Day 7/8)
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
info:
  app:
    name: ${spring.application.name}
    description: ShopSage user service — registration, authentication and user profiles
logging:
  # traceId/spanId only: Boot's default console pattern already prints the application name, so adding it here
  # would print it twice (env: LOGGING_PATTERN_CORRELATION).
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
  level:
    com.shopsage: ${LOG_LEVEL:INFO}
